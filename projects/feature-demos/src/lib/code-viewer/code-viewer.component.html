<div class="code-viewer-container">
  <div class="code-viewer-header">
    <div class="file-tabs">
      <button 
        *ngFor="let file of files; let i = index" 
        class="tab-btn" 
        [class.tab-btn--active]="i === activeFileIndex"
        (click)="selectFile(i)"
      >
        <span class="file-icon" [attr.data-lang]="file.language"></span>
        {{ file.name }}
      </button>
    </div>
    
    <button class="copy-btn" (click)="copyCode()" [attr.aria-label]="copied ? 'Copied' : 'Copy code'">
      <svg *ngIf="!copied" class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <svg *ngIf="copied" class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      {{ copied ? 'Copied!' : 'Copy' }}
    </button>
  </div>
  
  <div class="code-viewport">
    <pre class="code-pre"><code [textContent]="activeCode"></code></pre>
  </div>
</div>
